<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bus Duty">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0eb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1c22">
<title>Bus Duty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --r: 18px; --r-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#f5f0eb; --surface:#faf8f5; --surface2:#f0ece6;
  --border:#e0d9d0; --text:#2c2620; --text2:#7a6f65; --text3:#b0a49a;
  --accent:#7c9a7e; --accent-bg:#7c9a7e22; --accent-txt:#4a7050;
  --danger:#b5584a;
  --shadow:0 2px 10px rgba(80,60,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1e1c22; --surface:#26232c; --surface2:#2e2a36;
    --border:#38343f; --text:#ece8f0; --text2:#9e97aa; --text3:#5a5465;
    --accent:#8bab8e; --accent-bg:#8bab8e26; --accent-txt:#a8c9ab;
    --danger:#e08577;
    --shadow:0 2px 12px rgba(0,0,0,.25);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 96px)}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{font-size:28px;font-weight:800}
.date{color:var(--text2);font-weight:600}
.seg{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:4px;gap:4px;margin:10px 0 8px}
.seg button{flex:1;border:none;background:none;color:var(--text2);font-family:inherit;font-size:15px;font-weight:700;
  padding:9px 0;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.progress{color:var(--text2);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bus{position:relative;border:2px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:var(--r);padding:14px 6px;min-height:84px;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow);
  transition:transform .1s,background .2s,border-color .2s}
.bus:active{transform:scale(.96)}
.bus .num{font-size:26px;font-weight:800;line-height:1}
.bus .time{font-size:13px;font-weight:700;color:var(--text3)}
.bus.arrived{background:var(--accent-bg);border-color:var(--accent)}
.bus.arrived .num{color:var(--accent-txt)}
.bus.arrived .time{color:var(--accent-txt)}
.bus .del{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:none;
  background:var(--danger);color:#fff;font-size:16px;font-weight:800;line-height:26px;display:none}
.editing .bus .del{display:block}
.editing .bus{border-style:dashed}
.btn{border:none;border-radius:var(--r-sm);padding:12px 16px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.actions .btn{flex:1 1 140px}
.add{display:none;gap:8px;margin-top:14px}
.editing .add{display:flex}
.add input{flex:1;min-width:0;border:2px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:var(--r-sm);padding:10px 12px;font-family:inherit;font-size:16px}
h2{font-size:17px;margin:28px 0 10px}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-sm);overflow:hidden;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-size:13px;font-weight:700;background:var(--surface2)}
.empty{color:var(--text3);padding:14px 0}
.list{display:flex;flex-direction:column;gap:8px}
.t{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--r-sm);
  padding:14px 16px;font-family:inherit;font-size:20px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .1s}
.t:active{transform:scale(.98)}
.t .box{flex:none;width:24px;height:24px;border:2px solid var(--text3);border-radius:7px}
.t .name{flex:1}
.t .del{display:none;flex:none;width:28px;height:28px;border-radius:50%;border:none;background:var(--danger);
  color:#fff;font-size:17px;font-weight:800;line-height:28px;text-align:center}
.editing .t{border-style:dashed}
.editing .t .box{display:none}
.editing .t .del{display:block}
.done-msg{text-align:center;padding:28px 0;color:var(--accent-txt);font-size:20px;font-weight:800}
.btn{border:none;border-radius:var(--r-sm);padding:12px 16px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.actions .btn{flex:1 1 140px}
.add{display:none;gap:8px;margin-top:14px}
.editing .add{display:flex}
.add input{flex:1;min-width:0;border:2px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:var(--r-sm);padding:10px 12px;font-family:inherit;font-size:16px}
h2{font-size:17px;margin:28px 0 10px}
.checked{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;background:var(--accent-bg);color:var(--accent-txt);border-radius:999px;padding:8px 12px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.editing .checked-wrap{display:none}
.checked .empty{padding:0}
.panel[hidden]{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding:6px 16px calc(var(--safe-bottom) + 6px);z-index:5}
.tabs button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--text3);
  padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button .ic{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--accent-txt)}
.tabs button.on .ic{filter:none;opacity:1}
.hint{color:var(--text3);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 80px);z-index:6;transform:translateX(-50%) translateY(200px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;
  display:flex;gap:12px;align-items:center;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<section class="wrap panel" id="wrap" data-tab="buses">
  <header>
    <h1>Bus Duty</h1>
    <div class="date" id="today"></div>
  </header>
  <div class="seg" role="tablist">
    <button id="segAM" data-s="AM">Morning</button>
    <button id="segPM" data-s="PM">Afternoon</button>
  </div>
  <div class="progress" id="progress"></div>

  <div class="grid" id="grid"></div>
  <div class="add">
    <input id="newBus" placeholder="Bus number (e.g. 12)" inputmode="text" autocomplete="off">
    <button class="btn primary" id="addBtn">Add</button>
  </div>
  <div class="hint" id="hint">Tap a bus when it arrives. Tap it again to undo.</div>

  <div class="actions">
    <button class="btn primary" id="exportBtn">Download Excel</button>
    <button class="btn ghost" id="editBtn">Edit buses</button>
  </div>

  <h2 id="logTitle">Today's arrivals</h2>
  <div id="log"></div>
</section>

<section class="wrap panel" id="twrap" data-tab="teachers" hidden>
  <header>
    <h1>Teachers</h1>
    <div class="date" id="tToday"></div>
  </header>
  <div class="progress" id="tProgress"></div>

  <div class="list" id="tList"></div>
  <div class="add">
    <input id="tNewName" placeholder="Teacher name" autocomplete="off" autocapitalize="words">
    <button class="btn primary" id="tAddBtn">Add</button>
  </div>
  <div class="hint" id="tHint"></div>

  <div class="actions">
    <button class="btn ghost" id="tEditBtn">Edit teachers</button>
  </div>

  <div class="checked-wrap">
    <h2>Checked off today</h2>
    <div class="checked" id="tChecked"></div>
    <div class="hint">Tap a name to put it back on the list.</div>
  </div>
</section>

<nav class="tabs">
  <button data-tab="buses"><span class="ic">🚌</span>Buses</button>
  <button data-tab="teachers"><span class="ic">✅</span>Teachers</button>
</nav>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
// buses: ["1","4","12"...]   records: [{bus, date:"YYYY-MM-DD", time:"HH:MM:SS", ts, session:"AM"|"PM"}]
// Built-in route list, in pickup order. Used whenever the phone has no saved list.
const DEFAULT_BUSES = ["199","706","1003","75","74","95","509","1002","115","317","348"];
let buses = [], records = [], editing = false, undoFn = null, toastTimer;
// Morning before noon, Afternoon after. A manual pick sticks until the auto period changes.
let override = null; // {session, autoKey}

function save(){try{localStorage.setItem("busduty",JSON.stringify({buses,records}))}catch{}}
function load(){
  try{const r=JSON.parse(localStorage.getItem("busduty"));if(r){buses=r.buses||[];records=r.records||[]}}catch{}
  // No saved list, or the same buses saved in another order: use the built-in list and its order
  const same = buses.length === DEFAULT_BUSES.length && DEFAULT_BUSES.every(b => buses.includes(b));
  if (!buses.length || same) buses = [...DEFAULT_BUSES];
}

const pad = n => String(n).padStart(2,"0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const timeStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const niceTime = ts => new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const SESSION_NAME = {AM:"Morning", PM:"Afternoon"};
const autoSession = d => d.getHours() < 12 ? "AM" : "PM";
const autoKey = () => { const d = new Date(); return dateKey(d) + autoSession(d); };
const sessionOf = r => r.session || autoSession(new Date(r.ts)); // older records have no session
function currentSession(){
  if (override && override.autoKey !== autoKey()) override = null;
  return override ? override.session : autoSession(new Date());
}
const todayRecords = () => { const s = currentSession(); return records.filter(r => r.date === dateKey(new Date()) && sessionOf(r) === s); };
const $ = id => document.getElementById(id);

function render(){
  const now = new Date(), today = todayRecords(), session = currentSession();
  $("segAM").classList.toggle("on", session === "AM");
  $("segPM").classList.toggle("on", session === "PM");
  $("logTitle").textContent = `${SESSION_NAME[session]} arrivals`;
  $("today").textContent = now.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
  $("wrap").classList.toggle("editing", editing);
  $("editBtn").textContent = editing ? "Done" : "Edit buses";
  $("hint").textContent = editing ? "Add or remove buses. Past records are kept."
    : buses.length ? "Tap a bus when it arrives. Tap it again to undo." : "Tap “Edit buses” to add your bus numbers.";
  $("progress").textContent = buses.length ? `${new Set(today.map(r=>r.bus)).size} of ${buses.length} arrived` : "";

  $("grid").innerHTML = "";
  buses.forEach(b => {
    const rec = today.find(r => r.bus === b);
    const el = document.createElement("button");
    el.className = "bus" + (rec ? " arrived" : "");
    el.innerHTML = `<span class="num"></span><span class="time">${rec ? niceTime(rec.ts) : "—"}</span><span class="del" role="button" aria-label="Remove">×</span>`;
    el.querySelector(".num").textContent = b;
    el.onclick = e => {
      if (editing) {
        if (e.target.classList.contains("del") && confirm(`Remove bus ${b} from the list?`)) {
          buses = buses.filter(x => x !== b); save(); render();
        }
        return;
      }
      rec ? unmark(rec) : mark(b);
    };
    $("grid").appendChild(el);
  });

  const sorted = [...today].sort((a,b) => a.ts - b.ts);
  $("log").innerHTML = sorted.length
    ? `<table><tr><th>Bus</th><th>Arrived</th></tr>${sorted.map(r=>`<tr><td>${esc(r.bus)}</td><td>${niceTime(r.ts)}</td></tr>`).join("")}</table>`
    : `<div class="empty">No buses yet this ${SESSION_NAME[session].toLowerCase()}.</div>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function mark(bus){
  const d = new Date();
  const rec = {bus, date: dateKey(d), time: timeStr(d), ts: d.getTime(), session: currentSession()};
  records.push(rec); save(); render();
  toast(`Bus ${bus} arrived ${niceTime(rec.ts)}`, () => { records = records.filter(r => r !== rec); save(); render(); });
}
function unmark(rec){
  if (!confirm(`Undo arrival for bus ${rec.bus} (${niceTime(rec.ts)})?`)) return;
  records = records.filter(r => r !== rec); save(); render();
}

function toast(msg, undo){
  undoFn = undo; $("toastMsg").textContent = msg; $("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
}
$("toastUndo").onclick = () => { if (undoFn) undoFn(); undoFn = null; $("toast").classList.remove("show"); };

function addBus(){
  const v = $("newBus").value.trim();
  if (!v) return;
  if (!buses.includes(v)) {
    buses.push(v);
    save(); render();
  }
  $("newBus").value = ""; $("newBus").focus();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  const s = b.dataset.s;
  override = s === autoSession(new Date()) ? null : {session: s, autoKey: autoKey()};
  render();
});
$("addBtn").onclick = addBus;
$("newBus").onkeydown = e => { if (e.key === "Enter") addBus(); };
$("editBtn").onclick = () => { editing = !editing; render(); if (editing) $("newBus").focus(); };

$("exportBtn").onclick = () => {
  if (!records.length) { alert("No arrivals recorded yet."); return; }
  if (typeof XLSX === "undefined") { alert("Couldn't load the Excel library. Check your internet connection."); return; }
  const rows = [...records].sort((a,b) => a.ts - b.ts).map(r => {
    const d = new Date(r.ts);
    return {
      "Date": new Date(d.getFullYear(), d.getMonth(), d.getDate()),
      "Day": d.toLocaleDateString([], {weekday:"long"}),
      "Session": SESSION_NAME[sessionOf(r)],
      "Bus": isNaN(r.bus) ? r.bus : Number(r.bus),
      "Arrival Time": r.time,
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows, {cellDates:true, dateNF:"yyyy-mm-dd"});
  ws["!cols"] = [{wch:12},{wch:11},{wch:11},{wch:8},{wch:13}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bus Arrivals");
  XLSX.writeFile(wb, `bus-arrivals.xlsx`);
};

// Switch to the next round if the app is left open past noon or midnight
let shownKey = autoKey();
setInterval(() => { const k = autoKey(); if (k !== shownKey) { shownKey = k; render(); } }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

load();
if (!buses.length) editing = true;
render();

// ---------- Teachers tab ----------
(() => {
  // Built-in list, in release order (by grade level). Used whenever the phone has no saved list.
  const DEFAULT_TEACHERS = ["Smith","Prewitt","Campbell","Brawner","Allen","Alshouse","McClure","Blades","Ngere",
    "Pelczar","Vetter","Nunziata","Anderson","Grimes","Flora","Roberts","Miller","Berghoefer","Thompson","Ovais",
    "Coleman","Giorsetto"];
  // teachers: ["Smith",...]   checked: {date:"YYYY-MM-DD", names:{Smith: ts}}
  let teachers = [], checked = {date:"", names:{}}, editing = false;

  function save(){try{localStorage.setItem("teachercheckoff",JSON.stringify({teachers,checked}))}catch{}}
  function load(){
    try{const r=JSON.parse(localStorage.getItem("teachercheckoff"));if(r){teachers=r.teachers||[];checked=r.checked||checked}}catch{}
    if (!teachers.length) teachers = [...DEFAULT_TEACHERS];
  }

  // A new day starts with nobody checked off
  function todayChecked(){
    const k = dateKey(new Date());
    if (checked.date !== k) checked = {date:k, names:{}};
    return checked.names;
  }

  function render(){
    const done = todayChecked();
    $("tToday").textContent = new Date().toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
    $("twrap").classList.toggle("editing", editing);
    $("tEditBtn").textContent = editing ? "Done" : "Edit teachers";
    const left = editing ? teachers : teachers.filter(t => !(t in done));
    $("tProgress").textContent = editing ? "" : `${left.length} of ${teachers.length} left`;
    $("tHint").textContent = editing ? "Add or remove teachers. New names go at the bottom." : left.length ? "Tap a teacher to check them off." : "";

    $("tList").innerHTML = "";
    left.forEach(t => {
      const el = document.createElement("button");
      el.className = "t";
      el.innerHTML = `<span class="box"></span><span class="name"></span><span class="del" role="button" aria-label="Remove">×</span>`;
      el.querySelector(".name").textContent = t;
      el.onclick = e => {
        if (editing) {
          if (e.target.classList.contains("del") && confirm(`Remove ${t} from the list?`)) {
            teachers = teachers.filter(x => x !== t); delete done[t]; save(); render();
          }
          return;
        }
        done[t] = Date.now(); save(); render();
        toast(`${t} checked off`, () => { delete todayChecked()[t]; save(); render(); });
      };
      $("tList").appendChild(el);
    });
    if (!editing && !left.length) $("tList").innerHTML = `<div class="done-msg">All teachers checked off 🎉</div>`;

    const doneList = teachers.filter(t => t in done).sort((a,b) => done[a] - done[b]);
    $("tChecked").innerHTML = doneList.length ? "" : `<div class="empty">Nobody yet.</div>`;
    doneList.forEach(t => {
      const c = document.createElement("button");
      c.className = "chip";
      c.innerHTML = `<span></span><small>${niceTime(done[t])}</small>`;
      c.firstChild.textContent = t;
      c.onclick = () => { delete done[t]; save(); render(); };
      $("tChecked").appendChild(c);
    });
  }

  function addTeacher(){
    const v = $("tNewName").value.trim();
    if (!v) return;
    if (!teachers.includes(v)) { teachers.push(v); save(); render(); }
    $("tNewName").value = ""; $("tNewName").focus();
  }
  $("tAddBtn").onclick = addTeacher;
  $("tNewName").onkeydown = e => { if (e.key === "Enter") addTeacher(); };
  $("tEditBtn").onclick = () => { editing = !editing; render(); if (editing) $("tNewName").focus(); };

  // Reset the list if the app is left open past midnight
  setInterval(render, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  load();
  render();
})();

// ---------- Tabs ----------
// Opens to #buses / #teachers if the link says so, otherwise to the tab this phone used last
function showTab(tab){
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.tab !== tab);
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  try{localStorage.setItem("dutytab", tab)}catch{}
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
let startTab = location.hash.slice(1);
if (!["buses","teachers"].includes(startTab)) { try{startTab = localStorage.getItem("dutytab")}catch{} }
showTab(startTab === "teachers" ? "teachers" : "buses");
</script>
</body>
</html>
